name: Build and Push NetBox Container Image with Plugins

on:
  schedule:
    - cron: '0 0 * * 1'  # Check weekly on Monday at midnight UTC for new NetBox releases
  workflow_dispatch:
    inputs:
      netbox_version:
        description: 'NetBox version to build (e.g., v4.2.0). Leave empty to use the latest release.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      netbox_version: ${{ steps.get-version.outputs.version }}
      should_build: ${{ steps.check-build.outputs.should_build }}
    steps:
      - name: Get NetBox version
        id: get-version
        run: |
          if [ -n "${{ inputs.netbox_version }}" ]; then
            VERSION="${{ inputs.netbox_version }}"
          else
            VERSION=$(curl -sSf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/netbox-community/netbox/releases/latest \
              | jq -r '.tag_name')
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "NetBox version: ${VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check-build
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "Image ${IMAGE} already exists, skipping build"
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Image ${IMAGE} does not exist, will build"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-version.outputs.netbox_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NETBOX_VERSION=${{ needs.check-version.outputs.netbox_version }}
